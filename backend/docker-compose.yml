# ---------------------------------------------------------------------------
# Pressure — local/self-host stack: MongoDB + backend API.
#
#   docker compose up --build
#
# API is then reachable at http://localhost:8001  (routes are under /api).
# Point the Expo app's EXPO_PUBLIC_BACKEND_URL at that host.
# ---------------------------------------------------------------------------
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env

volumes:
  mongo_data: